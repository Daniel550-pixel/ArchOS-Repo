# Top-level rate limits
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;      # Auth is strictly rate-limited

server {
  listen 443 ssl http2;
  server_name localhost archos.example.ae;

  ssl_certificate /certs/tls.crt;
  ssl_certificate_key /certs/tls.key;
  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers on;

  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss: https://overpass-api.de https://api.open-meteo.com https://api.worldbank.org https://api.elevenlabs.io https://*.basemaps.cartocdn.com https://basemaps.cartocdn.com https://*.openstreetmap.org https://tile.openstreetmap.org; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://basemaps.cartocdn.com https://*.openstreetmap.org https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline'" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;

  # Block scanners & hidden files
  location ~ /\. { deny all; }
  location ~* \.(env|bak|sql|key|crt)$ { deny all; }

  location /api/v1/auth/ {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /metrics {
    proxy_pass http://backend:8000/metrics;
  }

  location /ws/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location / {
    proxy_pass http://frontend:3000;
    proxy_set_header Host $host;
  }
}
