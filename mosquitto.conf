# mosquitto.conf
# ArchOS Sovereign Telemetry Engine — Production Mosquitto MQTT & WSS Configuration

# ==============================================================================
# 1. Native TLS MQTT Listener (Port 8883)
# ==============================================================================
listener 8883 0.0.0.0
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.3
ciphers_tls13 TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
require_certificate false

# ==============================================================================
# 2. Secure WebSocket (WSS) Listener for Web / UI Telemetry (Port 8884)
# ==============================================================================
listener 8884 0.0.0.0
protocol websockets
http_dir /mosquitto/http
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.3
ciphers_tls13 TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
require_certificate false

# ==============================================================================
# 3. Optional Internal Unencrypted Gateway Listener (Port 1883)
# ==============================================================================
listener 1883 0.0.0.0
protocol mqtt

# ==============================================================================
# 4. Authentication, Authorization & Security Policies
# ==============================================================================
allow_anonymous true
# In hardened production mode, uncomment below:
# allow_anonymous false
# password_file /mosquitto/config/passwords.txt
# acl_file /mosquitto/config/acl.conf

# ==============================================================================
# 5. Persistence, Logging & Hardening
# ==============================================================================
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Connection Limits & Buffer Optimization
max_connections 10000
max_packet_size 65536
max_queued_messages 2000
