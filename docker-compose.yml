version: '3.8'

services:
  frontend:
    build: .
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1

  backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "pip install fastapi uvicorn pydantic && 
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  broker:
    image: eclipse-mosquitto:2
    container_name: archos-mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"   # Standard MQTT (internal gateway)
      - "8883:8883"   # MQTTS (TLS 1.3 Native TCP)
      - "8884:8884"   # WSS (WebSocket Secure TLS 1.3 for Browser Telemetry)
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./certs:/mosquitto/certs:ro
      - ./backend/acl.conf:/mosquitto/config/acl.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  mosquitto_data:
  mosquitto_log:
