# /backend/mosquitto_tls.conf
# ArchOS Sovereign Production MQTT TLS 1.3 Broker Configuration

# Native TCP MQTT with TLS 1.3 (Port 8883)
listener 8883 0.0.0.0
protocol mqtt
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
tls_version tlsv1.3
ciphers_tls13 TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
require_certificate false

# WebSocket Secure (WSS) with TLS 1.3 for Browser Ingestion (Port 9001)
listener 9001 0.0.0.0
protocol websockets
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
tls_version tlsv1.3
ciphers_tls13 TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

# Authentication & ACL Authorization
allow_anonymous false
password_file /etc/mosquitto/passwords.txt
acl_file /etc/mosquitto/acl.conf

# Production Performance & Security Hardening
max_connections 10000
max_packet_size 65536
max_queued_messages 2000
connection_messages true
log_type error
log_type warning
log_type notice
log_type information
