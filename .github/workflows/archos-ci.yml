name: ArchOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run lint
      - name: AIOS memory verification
        run: npm run test:aios-memory
      - name: Temporal control plane verification
        run: npm run test:temporal
      - name: World-state temporal verification
        run: npm run test:world-state
      - name: Projected world simulation verification
        run: npm run test:world-simulation
      - name: Governance verification
        run: npm run test:governance
      - name: A3 engine verification
        run: npm run test:a3
      - name: A4 fabric verification
        run: npm run test:a4
      - name: Webapp verification
        run: npm run test:webapp
      - name: Production build
        run: npm run build

  python-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q backend tests
      - name: Install Python test runner
        run: python -m pip install --upgrade pip pytest pytest-asyncio
      - name: Run promoted intelligence tests
        run: python -m pytest -q tests/test_multimodal_archos_integration.py tests/test_finsight_jarvis_integration.py

  ultron-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run ULTRON component test
        run: npm run test:ultron
