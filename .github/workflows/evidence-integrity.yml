name: Evidence Integrity

on:
  push:
    paths:
      - 'backend/agents/**'
      - 'backend/migrations/**'
      - '.github/workflows/evidence-integrity.yml'
  pull_request:
    paths:
      - 'backend/agents/**'
      - 'backend/migrations/**'
      - '.github/workflows/evidence-integrity.yml'

permissions:
  contents: read

jobs:
  evidence-integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: archos
          POSTGRES_PASSWORD: archos_ci
          POSTGRES_DB: archos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U archos -d archos_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+asyncpg://archos:archos_ci@localhost:5432/archos_test
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Apply evidence migrations
        run: |
          psql "postgresql://archos:archos_ci@localhost:5432/archos_test" \
            -v ON_ERROR_STOP=1 -f backend/migrations/versions/0001_archos_evidence_ledger.sql
          psql "postgresql://archos:archos_ci@localhost:5432/archos_test" \
            -v ON_ERROR_STOP=1 -f backend/migrations/versions/0002_evidence_ledger_immutability.sql
          psql "postgresql://archos:archos_ci@localhost:5432/archos_test" \
            -v ON_ERROR_STOP=1 -f backend/migrations/versions/0003_evidence_ledger_chain.sql

      - name: Verify migration schema
        run: |
          psql "postgresql://archos:archos_ci@localhost:5432/archos_test" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT to_regclass('archos_evidence_ledger') IS NOT NULL AS evidence_table;
          SELECT to_regclass('archos_evidence_ledger_audit') IS NOT NULL AS audit_table;
          SELECT to_regclass('archos_evidence_chain_state') IS NOT NULL AS chain_state;
          SQL

      - name: Python compile check
        run: python -m compileall -q backend/agents backend/migrations

      - name: Evidence integrity test gate
        run: python -m pytest -q tests -k 'evidence or verification or chain'
