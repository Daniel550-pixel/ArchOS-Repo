name: architecture-inventory

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - "scripts/architecture_inventory.py"
      - ".github/workflows/architecture-inventory.yml"

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run architecture census
        run: python scripts/architecture_inventory.py > architecture-inventory.json
      - name: Upload census
        uses: actions/upload-artifact@v4
        with:
          name: architecture-inventory
          path: architecture-inventory.json
