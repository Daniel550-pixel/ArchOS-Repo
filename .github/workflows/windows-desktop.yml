name: ArchOS Windows Desktop Build

on:
  push:
    branches:
      - main
      - feature/electron-windows-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build ArchOS web application and backend
        run: npm run build

      - name: Package Windows installer and portable executable
        run: npx electron-builder --win nsis portable --x64

      - name: Verify executable outputs
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release -Filter *.exe -File
          if ($files.Count -lt 2) {
            throw "Expected both NSIS installer and portable executable. Found: $($files.Count)"
          }
          $files | ForEach-Object {
            if ($_.Length -lt 1MB) { throw "Unexpectedly small executable: $($_.Name)" }
            Write-Host "$($_.Name) - $([math]::Round($_.Length / 1MB, 2)) MB"
          }

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: ArchOS-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
