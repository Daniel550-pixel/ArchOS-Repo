name: Sovereign CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run build

  sdk-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install SDK and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./sdk/python
          pip install pytest
      - name: Run public SDK contract tests
        run: pytest -q sdk/python/tests

  contracts:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/archos_ci
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: archos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d archos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: cd backend && pip install -r requirements.txt
      - name: Backend import smoke test
        run: cd backend && python -c "from app.main import app; print(app.title)"
      - name: Architecture audit (authority, imports, blocking paths, state, security boundaries)
        run: cd backend && python tools/architecture_audit.py
      - name: Phase A architecture census
        run: python scripts/architecture_inventory.py > architecture-inventory.json
      - name: Upload Phase A architecture census
        uses: actions/upload-artifact@v4
        with:
          name: architecture-inventory
          path: architecture-inventory.json
      - name: Legacy entrypoint delegation test
        run: cd backend && python -c "from backend.main import app as legacy_app; from app.main import app as authoritative_app; assert legacy_app is authoritative_app; print('legacy entrypoint delegates to authoritative app')"
      - name: Legacy authority guard
        run: |
          if grep -nE 'FastAPI\(|create_task\(|include_router\(|@app\.(get|post|put|patch|delete|websocket)' backend/main.py; then
            echo 'backend/main.py contains a forbidden second runtime implementation'
            exit 1
          fi
      - name: Security import smoke test
        run: cd backend && python -c "from backend.auth.webauthn import router as webauthn_router; from backend.auth.keysmith import router as keysmith_router; print(len(webauthn_router.routes), len(keysmith_router.routes))"
      - name: Integration import smoke test
        run: cd backend && python -c "from app.api.integrations import router; from app.services.integration_runtime import integration_runtime; print(len(router.routes), type(integration_runtime).__name__)"
      - name: Autonomous runtime import smoke test
        run: cd backend && python -c "from app.services.night_shift import night_shift_runtime; print(type(night_shift_runtime).__name__)"
      - name: Run backend tests
        run: pytest -q backend/tests
      - name: Start backend
        run: |
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/archos-backend.log 2>&1 &
          echo $! > /tmp/archos-backend.pid
      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /tmp/archos-root.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/archos-backend.log
          exit 1
      - name: Validate OpenAPI
        run: curl --fail --silent --show-error http://127.0.0.1:8000/openapi.json > openapi.json
      - name: Verify security, integration, and autonomous runtime routes exist
        run: |
          python - <<'PY'
          import json
          spec = json.load(open('openapi.json'))
          required = {
              '/api/v1/auth/register/options',
              '/api/v1/auth/register/verify',
              '/api/v1/auth/login/options',
              '/api/v1/auth/login/verify',
              '/api/v1/auth/session',
              '/api/v1/auth/logout',
              '/api/v1/auth/keysmith/tick',
              '/api/v1/auth/keysmith/unlock',
              '/api/integrations/modbus/state',
              '/api/integrations/modbus/writes',
              '/api/integrations/pulse/{slug}',
              '/api/integrations/osm/buildings',
              '/api/v1/night-shift/status',
              '/api/v1/night-shift/run',
          }
          missing = sorted(required - set(spec['paths']))
          if missing:
              raise SystemExit(f'Missing required routes: {missing}')
          PY
      - name: Generate TypeScript contracts
        run: npx --yes openapi-typescript openapi.json -o shared/contracts.generated.ts
      - name: Verify generated contracts
        run: test -s shared/contracts.generated.ts
      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/archos-backend.pid ]; then
            kill "$(cat /tmp/archos-backend.pid)" 2>/dev/null || true
          fi
